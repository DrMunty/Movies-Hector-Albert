<main class="min-h-screen w-full bg-black relative">
  
  <!-- Opcional: Quita los comentarios de la siguiente línea para usar una imagen de fondo fija -->

  <section class="max-w-7xl mx-auto px-4 py-8 relative z-10">
    
    <div class="mb-8 bg-[#1a1a1a] p-5 rounded-xl border border-zinc-800 shadow-md">
      <h1 class="text-2xl font-bold text-white mb-6 border-l-4 border-amber-400 pl-3">
        Search your favorite movies
      </h1>

      <form [formGroup]="filterForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        
        <div class="flex flex-col">
          <label class="text-xs font-semibold text-zinc-400 mb-1">Search by title </label>
          <input type="text" formControlName="query" placeholder="Ex: Inception..."
            class="rounded-md bg-zinc-900 border border-zinc-700 py-2 px-3 text-sm text-white focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-colors" />
        </div>

        <div class="flex flex-col">
          <label class="text-xs font-semibold text-zinc-400 mb-1">Sort by</label>
          <select formControlName="sort_by" 
            class="rounded-md bg-zinc-900 border border-zinc-700 py-2 px-3 text-sm text-white focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 disabled:opacity-50 disabled:cursor-not-allowed">
            <option value="popularity.desc">Most popular </option>
            <option value="vote_average.desc">Highest rating</option>
            <option value="primary_release_date.desc">Most recent</option>
          </select>
        </div>

        <div class="flex flex-col">
          <label class="text-xs font-semibold text-zinc-400 mb-1">Genre</label>
          <select formControlName="with_genres"
            class="rounded-md bg-zinc-900 border border-zinc-700 py-2 px-3 text-sm text-white focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 disabled:opacity-50 disabled:cursor-not-allowed">
            <option value="">All genres</option>
            @for (genre of genres(); track genre.id) {
              <option [value]="genre.id">{{ genre.name }}</option>
            }
          </select>
        </div>

        <div class="flex flex-col">
          <label class="text-xs font-semibold text-zinc-400 mb-1">Minimum rating</label>
          <select formControlName="vote_average_gte"
            class="rounded-md bg-zinc-900 border border-zinc-700 py-2 px-3 text-sm text-white focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 disabled:opacity-50 disabled:cursor-not-allowed">
            <option value=""> Any rating</option>
            <option value="8">Excellent (+8.0)</option>
            <option value="6">Good (+6.0)</option>
            <option value="4">Regular (+4.0)</option>
          </select>
        </div>

      </form>
    </div>

    @if (isLoading()) {
      <div class="flex justify-center items-center py-32">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-amber-400"></div>
      </div>
    } @else {
      
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 w-full mb-10">
        @for (movieItem of moviesList(); track movieItem.id) {
          <app-movie-card [movie]="movieItem" [routerLink]="['/movie', movieItem.id]" class= "cursor-pointer block hover:scale-[1.02] transition-transform duration-300"> </app-movie-card>
        } @empty {
          <div class="col-span-full py-20 text-center bg-zinc-900 rounded-xl border border-zinc-800">
            <p class="text-xl font-bold text-zinc-300">Movie could not be found.</p>
            <p class="text-zinc-500 mt-2">Try using different search filters.</p>
          </div>
        }
      </div>
    }

    @if (!isLoading() && moviesList().length > 0) {
      <div class="flex justify-center items-center space-x-6 border-t border-zinc-800 pt-6">
        <button (click)="prevPage()" [disabled]="currentPage() === 1"
          class="px-4 py-2 bg-zinc-800 text-white rounded-md font-medium hover:bg-zinc-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
          ← Previous
        </button>
        
        <span class="text-zinc-400 font-medium text-sm">
          Page <span class="text-white">{{ currentPage() }}</span> de {{ totalPages() }}
        </span>

        <button (click)="nextPage()" [disabled]="currentPage() === totalPages()"
          class="px-4 py-2 bg-zinc-800 text-white rounded-md font-medium hover:bg-zinc-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
          Next →
        </button>
      </div>
    }

  </section>
</main>
