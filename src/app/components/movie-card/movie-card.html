<div class="flex flex-row h-full rounded-xl bg-[#1a1a1a] p-3 gap-4 border border-transparent hover:bg-[#222222] transition-colors duration-300 w-full min-w-87.5">
  
  <div class="relative w-27.5 sm:w-32.5 shrink-0 bg-zinc-800 rounded-lg overflow-hidden flex items-center justify-center">
    
    @if (movie().poster_path) {
      <img 
        [src]="posterUrl" 
        [alt]="movie().title"
        class="h-40 sm:h-48.75 w-full object-cover shadow-md"
        loading="lazy"
      />
    } @else {
    
      <div class="flex flex-col items-center justify-center w-full h-40 sm:h-48.75 bg-[#1a1a1a] text-zinc-700 border border-zinc-800">
        <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        <span class="text-[10px] font-bold tracking-wider">NO POSTER</span>
      </div>
    }
    
    <button class="absolute top-0 left-0 bg-black/60 hover:bg-black/80 text-white p-1.5 rounded-br-lg transition-colors cursor-pointer flex items-center justify-center">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
      </svg>
    </button>
  </div>

  <div class="flex flex-1 flex-col py-1 justify-start overflow-hidden">

    <h3 class="text-white font-bold text-base leading-tight line-clamp-2 pr-2" [title]="movie().title">
      {{ movie().title }}
    </h3>
    
    <div class="flex items-center text-zinc-400 text-xs mt-1.5 gap-3">
      <span>{{ movie().release_date ? (movie().release_date | slice:0:4) : 'N/A' }}</span>
      <span>2h 25m</span>
      <span>12</span>
    </div>

    <div class="flex flex-wrap items-center text-xs mt-2.5 gap-x-4 gap-y-2">
      <div class="flex items-center text-zinc-300">
        <svg class="w-4 h-4 text-amber-400 mr-1 fill-current" viewBox="0 0 24 24">
          <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
        </svg>
        <span class="font-bold text-white mr-1">{{ movie().vote_average | number:'1.1-1' }}</span>
        <span class="text-zinc-500">({{ movie().vote_count }})</span>
      </div>

      <button class="flex items-center text-[#5799ef] hover:text-blue-300 transition-colors font-medium">
        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path>
        </svg>
       Rate
      </button>
    </div>

    <div class="mt-auto pt-3">
      <button class="flex items-center text-[#5799ef] hover:text-blue-300 transition-colors text-xs font-medium">
        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
        </svg>
        Mark as watched
      </button>
    </div>

  </div>
</div>
